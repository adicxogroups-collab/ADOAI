<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adoai Assistant</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #121a33;
        --text: #e8ecff;
        --muted: #9fb0ff;
        --accent: #6f8cff;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(circle at top, #1a2550 0%, var(--bg) 55%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(760px, 100%);
        background: linear-gradient(170deg, #18234a, var(--panel));
        border: 1px solid #2a3a75;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 3vw, 2.5rem);
      }

      p { margin: 0 0 14px; line-height: 1.6; color: var(--muted); }

      code {
        background: #0d1430;
        border: 1px solid #2e4289;
        border-radius: 8px;
        padding: 2px 6px;
        color: #c8d5ff;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
        flex-wrap: wrap;
      }

      a {
        text-decoration: none;
        color: white;
        background: var(--accent);
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 600;
      }

      a.secondary {
        background: transparent;
        border: 1px solid #3f58b5;
        color: #c8d5ff;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>🚀 Adoai</h1>
      <p>
        Your AI assistant is ready. Run it from this project folder with
        <code>python3 main.py</code>.
      </p>
      <p>
        For full model capability, set <code>OPENAI_API_KEY</code> (plus optional
        <code>OPENAI_BASE_URL</code> and <code>OPENAI_MODEL</code>) before launch.
      </p>
      <div class="actions">
        <a href="README.md">Read setup guide</a>
        <a class="secondary" href="main.py">Open CLI entrypoint</a>
      </div>
    </main>
  </body>
</html>
